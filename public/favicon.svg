<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c8f58"/>
      <stop offset="100%" stop-color="#14462a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Verde Office Project -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Borda Sutil -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="9.5" fill="none" stroke="#52b788" stroke-width="1" opacity="0.6"/>

  <!-- Barras do Cronograma / Gantt ao fundo -->
  <rect x="26" y="16" width="26" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <rect x="32" y="26" width="22" height="6" rx="3" fill="url(#barGrad)"/>
  <rect x="24" y="36" width="28" height="6" rx="3" fill="#facc15" opacity="0.9"/>
  <rect x="36" y="46" width="16" height="6" rx="3" fill="#4ade80" opacity="0.9"/>

  <!-- Símbolo "P" estilizado do Microsoft Project -->
  <rect x="10" y="13" width="18" height="38" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M 15 19 L 21 19 C 24 19 26 21 26 24 C 26 27 24 29 21 29 L 18 29 L 18 45 L 15 45 Z" fill="#1b5e20"/>
  <path d="M 18 22 L 21 22 C 22.5 22 23.5 23 23.5 24 C 23.5 25 22.5 26 21 26 L 18 26 Z" fill="#ffffff"/>
</svg>